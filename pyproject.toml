[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytask-pro"
version = "1.0.0"
description = "Automated scripting, web scraping, data cleaning and CLI utility engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
pytask-pro = "pytask_pro.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
